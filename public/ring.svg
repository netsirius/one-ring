<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="techRingGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  {/* Outer Loop */}
  <circle cx="50" cy="50" r="41" stroke="url(#techRingGold)" stroke-width="3.5" />

  {/* Inner Hub */}
  <circle cx="50" cy="50" r="29" stroke="url(#techRingGold)" stroke-width="2" opacity="0.85" />

  {/* 4 Agent Nodes */}
  <circle cx="50" cy="9" r="2.5" fill="#FCD34D" />
  <circle cx="91" cy="50" r="2.5" fill="#FCD34D" />
  <circle cx="50" cy="91" r="2.5" fill="#FCD34D" />
  <circle cx="9" cy="50" r="2.5" fill="#FCD34D" />

  {/* Technical Segment Track */}
  <circle cx="50" cy="50" r="35" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4 6" opacity="0.45" />

  {/* Center Core */}
  <circle cx="50" cy="50" r="3.5" fill="url(#techRingGold)" />
</svg>
